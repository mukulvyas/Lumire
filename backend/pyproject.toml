[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lumiere-backend"
version = "0.1.0"
description = "FastAPI Asynchronous Microservice for Lumière AI Celebration Atelier"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mukul Vyas" }]

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
